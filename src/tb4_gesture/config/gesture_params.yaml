# Bài 06 - tham số hai node (ros2 launch tb4_gesture gesture_control.launch.py)
gesture_recognition_node:
  ros__parameters:
    camera_index: 0          # /dev/video0
    frame_width: 640
    frame_height: 480
    mirror: true             # lật gương ảnh webcam
    show_window: true
    min_score: 0.6           # độ tin cậy tối thiểu của MediaPipe
    stable_window: 8         # bỏ phiếu trên 8 khung gần nhất (~0.27 s ở 30 FPS)
    stable_ratio: 0.75       # nhãn phải chiếm >= 75% số khung
    wave_amplitude: 0.05     # biên độ đổi chiều ngang (tỉ lệ bề rộng ảnh)
    wave_reversals: 3        # số lần đổi chiều trong wave_window để tính là vẫy tay
    wave_window: 1.5         # s

robot_behavior_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    control_rate: 20.0       # Hz
    signal_timeout: 1.0      # s không nhận /detected_gesture -> dừng robot
    gesture_cooldown: 1.5    # s giữa 2 lần kích hoạt cùng một cử chỉ
    wave_requires_confirm: false   # true: Wave cũng phải xác nhận bằng Thumb_Up
    set_safety_override: true
    stop_on_bump: true
    # Pointing_Up: tiến - lùi
    fb_distance: 0.3         # m
    fb_speed: 0.2            # m/s
    fb_repeats: 4
    # Victory: quỹ đạo tròn (w = v / r)
    circle_radius: 0.5       # m
    circle_speed: 0.2        # m/s
    circle_turns: 1.0        # số vòng
    # Wave: xoay trái - phải
    wave_angle: 0.5          # rad (~29 độ) mỗi phía
    wave_speed: 1.0          # rad/s
    wave_cycles: 2
